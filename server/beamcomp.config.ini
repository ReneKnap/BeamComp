# BeamComp settings. Read once, when the server starts: change something, then restart it.
#
# key = value, one per line. A "#" starts a comment only at the START of a line, and the
# value is everything after the FIRST "=", with outer spaces removed. So a password may
# contain both. A line that cannot be read is skipped with a warning; the rest still applies.


# --- Who may start races ------------------------------------------------------------
#
# Starting and aborting races, saving and deleting grids and setups, and running the
# championship are admin-only. Set one of the two below, or both.
#
# WITH NEITHER SET, EVERY PLAYER MAY DO ALL OF IT.

# Any text you like. A player types /raceui, enters it in the panel that opens, and is an
# admin until they leave the server. Five wrong tries cost a minute.
#   example:  racePassword = something-only-we-know
racePassword =

# Race admins by BeamMP name, comma separated. A guest gets a new name every time they
# start the game, so list only players who log in to BeamMP.
raceAdmins =


# --- Names --------------------------------------------------------------------------

# Whether players may pick the name everyone sees, with /name. Anyone who picks none
# races under their BeamMP name.
# false = always show the BeamMP name.
useClientName = true

# Whether a driver's name is drawn over their car, for everyone on the server.
# Race props never carry a name, in either setting.
showDriverNames = true
