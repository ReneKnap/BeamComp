# BeamComp server settings. Lines starting with # are comments.
# A line that cannot be read is skipped with a warning -- it does not invalidate the rest.
# Read once, when the server starts.
#
# key = value, one per line. A # only starts a comment at the START of a line, so a value may
# contain one. Leading and trailing spaces around a value are dropped.

# Race admins by BeamMP name, comma separated.
# Unusable while BeamMP login is broken.
raceAdmins =

# Anyone who types /raceui and enters this is a race admin until he disconnects.
# EMPTY = EVERY player may start races, overwrite grids and run the championship.
racePassword =

# Use the name a player set with /name. false = always use the BeamMP name.
useClientName = true
