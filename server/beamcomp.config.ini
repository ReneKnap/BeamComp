# ==============================================================================
#  BeamComp settings
# ==============================================================================
#
#  This is the only file you need to edit. Everything else configures itself.
#
#  It is read once, when the server starts -- change something, restart the
#  server.
#
#  One setting per line, written as "key = value". A line starting with # is a
#  comment. A line BeamComp cannot read is skipped with a warning naming its
#  line number, and every other setting still applies.
#
#  The value is everything after the first "=", with spaces at both ends
#  removed. So a value may contain "=" and "#", but it cannot begin or end with
#  a space -- there are no quotes.
#
# ==============================================================================


# ------------------------------------------------------------------------------
#  Who may start races
# ------------------------------------------------------------------------------
#
#  Starting and aborting races, saving and deleting grids and setups, and
#  running the championship are admin-only. There are two ways to become an
#  admin, and they work side by side.
#
#  IF YOU SET NEITHER OF THEM, EVERY PLAYER MAY DO ALL OF IT.
#
#  That is the default so that nothing breaks on a server that already runs,
#  and BeamComp prints a warning box every time it starts while it applies. On
#  a friends-only server it is fine. On a server strangers can join, set the
#  password below.


#  A password. Any text you like.
#
#  A player types /raceui, the setup panel opens with a password box, and the
#  right password makes them an admin until they leave the server. Everyone
#  enters it once per session, and nothing is stored on their machine. Five
#  wrong tries cost a minute.
#
#  Example:  racePassword = redlight-2026
#
racePassword =


#  Race admins by BeamMP name, separated by commas. These players are admins
#  from the moment they join, without typing anything.
#
#  This does not work while BeamMP account login is broken: everyone connects
#  as a guest, and the guest name changes every time they start the game. Use
#  the password until logins come back.
#
#  Example:  raceAdmins = Alice, Bob
#
raceAdmins =


# ------------------------------------------------------------------------------
#  Player names
# ------------------------------------------------------------------------------

#  Whether players may pick the name everyone sees, with /name.
#  false = always show their BeamMP name instead.
#
useClientName = true
