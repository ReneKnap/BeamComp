# BeamComp car lists. Pick one in the race panel under Vehicle restrictions.
# This file is read again every time the panel opens and every time a race starts,
# so a change here needs no restart.
#
# A list starts with its name in square brackets. "mode = whitelist" lets only the
# cars below race, "mode = blacklist" lets every car race except them. Then one car per
# line: a model for all of its versions, or a model and one version with a colon
# between them. /cars in chat shows the models, /cars <model> the versions.
#
# A "#" starts a comment only at the START of a line. A line that cannot be read is
# skipped with a warning; the rest still applies. A list without a mode is skipped.
#
#   [name of the list]
#   mode = whitelist
#   model
#   model:version
