<div class="bc-controls">
  <style scoped>
    /* This app IS interactive (app.json deliberately carries no "interactive": "no", unlike
       BeamCompHud): every chip is a button into BeamNG's binding dialog. So the host frame keeps
       pointer-events: auto and nothing here has to re-enable them. */
    .bc-controls { display: flex; flex-direction: column; height: 100%; box-sizing: border-box;
      font-family: 'Roboto', sans-serif; font-size: 13px; color: #f0f0f0;
      background: rgba(20, 22, 26, 0.92); border-radius: 4px; overflow: hidden; }
    .bc-ctl-bar { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; padding: 5px 8px;
      border-bottom: 1px solid rgba(255,255,255,0.12); }
    /* The title takes the free space, so the gear and the X sit at the right edge together -- and the X
       stays there alone while a capture hides the gear. */
    .bc-ctl-title { margin-right: auto; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em;
      font-size: 11px; color: #8fd3ff; }
    .bc-ctl-x, .bc-ctl-gear-head { background: #2a2e35; color: #f0f0f0;
      border: 1px solid rgba(255,255,255,0.18); border-radius: 3px; padding: 0 7px;
      font-size: 12px; line-height: 18px; cursor: pointer; }
    .bc-ctl-x:hover, .bc-ctl-gear-head:hover { background: #3a4049; }
    /* The gear menu: the setup panel's settings popover (.bc-dd-list + .bc-settings-list there),
       anchored to the right edge under the gear and sized to its one entry. */
    .bc-ctl-gear { position: relative; }
    .bc-ctl-menu { position: absolute; right: 0; top: 100%; z-index: 50; margin-top: 2px; padding: 4px;
      background: #20242b; border: 1px solid rgba(255,255,255,0.22); border-radius: 3px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
    .bc-ctl-menu-act { display: block; width: 100%; padding: 4px 7px; text-align: left; white-space: nowrap;
      color: inherit; font-family: inherit; font-size: 12px; background: none; border: none; cursor: pointer; }
    .bc-ctl-menu-act:hover { background: #2e7d32; }
    .bc-ctl-body { flex: 1 1 auto; overflow-y: auto; padding: 6px 8px; }
    .bc-ctl-wait { color: #9aa3ad; font-size: 12px; }
    /* Wraps because the row carries a button beside the hint and the window may be dragged down to its
       260px minimum -- without it the button would be cut off with nothing to show for it. */
    .bc-ctl-hint { color: #9aa3ad; font-size: 11px; margin-top: 8px;
      border-top: 1px solid rgba(255,255,255,0.12); padding-top: 5px;
      display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
    .bc-ctl-row { display: flex; align-items: flex-start; gap: 8px; margin: 5px 0; }
    /* Capped, not proportional -- same reasoning as the setup panel's label column: every pixel a
       wider window adds should land on the key chips, not on two captions that never needed it. */
    .bc-ctl-name { flex: 0 0 min(40%, 132px); }
    .bc-ctl-label { display: block; font-weight: 700; }
    .bc-ctl-does { display: block; color: #9aa3ad; font-size: 11px; line-height: 1.25; }
    .bc-ctl-keys { flex: 1 1 auto; min-width: 0; display: flex; flex-wrap: wrap;
      justify-content: flex-end; gap: 4px; }
    /* The chip box is OURS, not the engine's: the game's binding directive draws a glyph and a name
       and no box at all, so without this the two halves of the window would look like two features.
       The click target is this wrapper, never the <binding> inside it -- that element renders nothing
       at all when it has nothing to show, so there would be no target left to click. */
    .bc-ctl-chip { display: inline-flex; align-items: center; padding: 1px 6px;
      background: #2a2e35; border: 1px solid rgba(255,255,255,0.18); border-radius: 3px;
      white-space: nowrap; }
    .bc-ctl-hot { cursor: pointer; }
    .bc-ctl-hot:hover { background: #3a4049; border-color: rgba(143,211,255,0.55); }
    /* The fallback chip is deliberately NOT a <kbd>: BeamNG styles kbd and its child spans globally
       (ui/entrypoints/main/main.css:5-22, including text-transform: uppercase), which would render a
       device name as KEYBOARD0 and make our half of the window drift with the game's stylesheet. */
    .bc-ctl-dev { color: #9aa3ad; font-size: 11px; margin-right: 4px; }
    .bc-ctl-key { font-family: 'Noto Sans Mono', monospace; }
    .bc-ctl-na { font-weight: 700; }
    /* The remove x and the add +: same chip box, so a row reads as one set of controls. */
    .bc-ctl-del { margin-left: 5px; color: #9aa3ad; font-size: 10px; line-height: 1; }
    .bc-ctl-del:hover { color: #ff8a80; }
    .bc-ctl-add { font-weight: 700; color: #8fd3ff; padding: 1px 8px; }
    /* The capture prompt is the loudest thing in the window on purpose: while it is up, nothing the
       player presses does what it normally does. */
    .bc-ctl-prompt { margin-top: 8px; border-top: 1px solid rgba(255,255,255,0.12); padding-top: 5px;
      color: #ffd54f; font-size: 12px; }
    .bc-ctl-status { margin-top: 8px; border-top: 1px solid rgba(255,255,255,0.12); padding-top: 5px;
      color: #8fd3ff; font-size: 11px; }
    .bc-ctl-settings { margin-left: auto; background: #2a2e35; color: #f0f0f0;
      border: 1px solid rgba(255,255,255,0.18); border-radius: 3px; padding: 1px 7px;
      font-size: 11px; cursor: pointer; white-space: nowrap; }
    .bc-ctl-settings:hover { background: #3a4049; }
  </style>

  <div class="bc-ctl-bar">
    <span class="bc-ctl-title">BeamComp assist keys</span>
    <!-- The gear, like the setup panel's, with Reset UI layout as its only entry -- the way a player
         without admin access reaches the reset. Hidden while a capture runs: a left click on it would be
         recorded as the new key. -->
    <div class="bc-ctl-gear" ng-if="!prompt">
      <button class="bc-ctl-gear-head" ng-click="toggleMenu()">&#x2699;</button>
      <div class="bc-ctl-menu" ng-if="menuOpen">
        <button class="bc-ctl-menu-act" ng-click="resetUiLayout()">Reset UI layout</button>
      </div>
    </div>
    <button class="bc-ctl-x" ng-click="close()">&#10005;</button>
  </div>

  <div class="bc-ctl-body">
    <!-- Nothing is claimed before the engine has answered: an early "[N/A]" would tell a correctly
         bound player that he has no key, which is the one thing this window must never do. -->
    <div class="bc-ctl-wait" ng-if="!rows">Reading your key bindings.</div>

    <div class="bc-ctl-row" ng-repeat="row in rows track by row.action">
      <span class="bc-ctl-name">
        <span class="bc-ctl-label">{{row.label}}</span>
        <span class="bc-ctl-does">{{row.does}}</span>
      </span>
      <span class="bc-ctl-keys">
        <!-- One chip per device carrying this action. `device` and `key` are EXPRESSIONS: the game's
             binding directive binds them with '=' and only `action`/`showunassigned` with '@'
             (ui/modules/options/options.js:912-920). Quoting them as strings renders nothing, silently. -->
        <span class="bc-ctl-chip" ng-class="{'bc-ctl-hot': canEdit || canBind}"
              ng-repeat="c in row.controls track by $index"
              ng-click="edit(row, c)">
          <binding ng-if="useDirective" device="c.device" key="c.key"></binding>
          <span ng-if="!useDirective"><span class="bc-ctl-dev">{{c.device}}</span><span
            class="bc-ctl-key">{{c.label}}</span></span>
          <!-- Remove. stopPropagation lives in the handler, not here: the x sits INSIDE the chip, and
               without it the click would start a capture on the binding it just deleted. -->
          <span class="bc-ctl-del" ng-if="canBind" ng-click="remove(row, c, $event)">&#10005;</span>
        </span>
        <!-- Unassigned: the directive's own [N/A]. With rebinding it starts a capture, without it it
             falls back to the settings without an oldBinding -- the route the options UI itself takes
             when adding a binding (controls-bindings.html:44 -> options.js:2189). -->
        <span class="bc-ctl-chip bc-ctl-na" ng-class="{'bc-ctl-hot': canEdit || canBind}"
              ng-if="row.controls.length === 0"
              ng-click="add(row)">
          <binding ng-if="useDirective" showunassigned="true"></binding>
          <span ng-if="!useDirective">[N/A]</span>
        </span>
        <!-- Add another device's key to the same action. Only where a capture can actually run. -->
        <span class="bc-ctl-chip bc-ctl-add bc-ctl-hot"
              ng-if="canBind && row.controls.length > 0"
              ng-click="add(row)">+</span>
      </span>
    </div>

    <!-- While a capture runs the player's controls are dead, so this line is the only thing on screen
         telling him what to do and how to get out. It replaces the footer rather than joining it: two
         competing instructions at the moment nothing responds is worse than one. -->
    <div class="bc-ctl-prompt" ng-if="prompt">{{prompt}}</div>

    <!-- The outcome of the last action, one line, cleared by the next one. -->
    <div class="bc-ctl-status" ng-if="status && !prompt">{{status}}</div>

    <!-- Everything in this row depends on the engine surface, so the row hangs on canBind || canEdit: on a
         build where neither the controls store nor an options route answers there is nothing to say here.
         Each line still carries its own condition, so a player who cannot open the settings page is not
         told to click a key to open it. `prompt` hides the whole row: while a capture runs, its instruction
         is the only thing that may stand here (see the prompt above).
         Reset UI layout used to sit here too and needed none of that surface; it moved into the gear in
         the title bar (owner's decision 2026-10-10). -->
    <div class="bc-ctl-hint" ng-if="!prompt && (canBind || canEdit)">
      <span ng-if="canBind">Click a key to change it, + to add one.</span>
      <span ng-if="!canBind && canEdit">Click a key to open BeamNG's controls settings.</span>
      <button class="bc-ctl-settings" ng-if="canEdit" ng-click="openSettings(null, null)">Game settings</button>
    </div>
  </div>
</div>
